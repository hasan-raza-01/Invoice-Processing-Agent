services:
  api:
    build: .
    container_name: invoice_agent_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/invoice_agent.db
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: uvicorn invoice_agent.api.main:app --host 0.0.0.0 --port 8000
    networks:
      - invoice_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ui:
    build: .
    container_name: invoice_agent_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run src/invoice_agent/frontend/app.py --server.port 8501 --server.address 0.0.0.0
    networks:
      - invoice_network

networks:
  invoice_network:
    driver: bridge
