version: '3.8'

services:
  api:
    build: .
    container_name: invoice_agent_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./invoice_agent.db
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./invoice_agent.db:/app/invoice_agent.db
    command: uvicorn invoice_agent.api.main:app --host 0.0.0.0 --port 8000 --reload

  ui:
    build: .
    container_name: invoice_agent_ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    command: streamlit run src/invoice_agent/frontend/app.py --server.port 8501 --server.address 0.0.0.0
